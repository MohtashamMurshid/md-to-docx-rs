[package]
name = "md-to-docx-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Convert Markdown into a Word .docx file"

[[bin]]
name = "md-to-docx"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
md-to-docx = { path = "../md-to-docx" }
notify = "=6.1.1"
serde_json = "=1.0.140"
signal-hook = "=0.3.17"
unicode-normalization = "=0.1.24"

[dev-dependencies]
zip = "=9.0.1"
