# Vendored copy of pulldown-cmark 0.13.4 (MIT), patched for remark parity.
# See VENDORED.md for the list of changes.
[package]
name = "pulldown-cmark"
version = "0.13.4"
authors = [
    "Raph Levien <raph.levien@gmail.com>",
    "Marcus Klaas de Vries <mail@marcusklaas.nl>",
]
license = "MIT"
description = "A pull parser for CommonMark (vendored, patched for remark parity)"
repository = "https://github.com/raphlinus/pulldown-cmark"
edition = "2021"
rust-version = "1.71.1"
publish = false

[lib]
name = "pulldown_cmark"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
unicase = "2.6"
memchr = "2.5"
getopts = { version = "0.2", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
pulldown-cmark-escape = { version = "0.11", optional = true }

[features]
default = ["getopts", "html"]
gen-tests = []
simd = ["pulldown-cmark-escape?/simd"]
html = ["pulldown-cmark-escape"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustbuild)'] }
