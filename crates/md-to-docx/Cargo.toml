[package]
name = "md-to-docx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Convert Markdown into a Word .docx package"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
pulldown-cmark = "=0.13.4"
quick-xml = "=0.42.0"
regex = "=1.11.1"
serde_json = "=1.0.140"
resvg = "=0.48.1"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
syntect = "=5.3.0"
tiny-skia = "=0.12.0"
url = "=2.5.8"
usvg = "=0.48.1"
webpki-roots = "=1.0.9"
zip = "=9.0.1"
