[package]
name = "md-to-docx-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Node binding for the Markdown to docx bytes API"

[lib]
crate-type = ["cdylib", "rlib"]
name = "md_to_docx_napi"

[features]
default = ["node"]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
md-to-docx = { path = "../md-to-docx" }
napi = { version = "=3.14.2", default-features = false, features = ["napi9"], optional = true }
napi-derive = { version = "=3.6.12", optional = true }
serde_json = "=1.0.140"

[build-dependencies]
napi-build = "=2.6.0"
