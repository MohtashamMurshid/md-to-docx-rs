name: assemble ooxml
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-ooxml.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble ooxml.rs from verified slices
        run: |
          set -euo pipefail
          out=crates/md-to-docx/src/ooxml.rs
          : > "$out"
          for i in $(seq -w 0 19); do
            cat ".upload-parts/ooxml-$i" >> "$out"
          done
          sha=$(git hash-object "$out")
          echo "sha=$sha"
          test "$sha" = "10e09cda94414eb27a3b3813672483f8b7eef5b1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$out"
          git rm -r .upload-parts
          git rm .github/workflows/assemble-ooxml.yml
          git commit -m "Add crates/md-to-docx/src/ooxml.rs."
          git push origin HEAD:main
