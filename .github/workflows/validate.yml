name: Validate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/md-to-docx/tests/oracle/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format, lint, parity and Node tests
        run: ./scripts/validate.sh
      - name: Full-package differential corpus
        run: |
          python -m pip install Pillow
          node scripts/parity/generate.mjs output/parity-ci
          python scripts/parity/verify.py output/parity-ci
      - name: Check release benchmark and output semantics
        run: cargo run --locked --release -p md-to-docx --example benchmark -- --runs 1
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.10.0', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: rustup show
      - run: npm ci --prefix crates/md-to-docx-napi
      - run: npm run build --prefix crates/md-to-docx-napi
      - run: npm test --prefix crates/md-to-docx-napi
      - run: npm run test:types --prefix crates/md-to-docx-napi
      - name: Pack and install the platform candidate
        shell: bash
        run: |
          node scripts/release/pack.mjs 0.1.0-rc.4
          mkdir -p output/package-smoke
          cd output/package-smoke
          npm init -y
          npm install ../release/md-to-docx-rs-0.1.0-rc.4.tgz
          cd ../..
          node scripts/release/smoke.mjs output/package-smoke
